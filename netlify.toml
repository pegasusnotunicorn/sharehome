[build]
  publish = "dist"
  command = "npm run build"

[dev]
  command = "npm start"
  targetPort = 3000
  port = 8888
  framework = "#custom"

[build.environment]
  NODE_VERSION = "20"


[functions]
  external_node_modules = ["node-fetch", "stripe"]
  node_bundler = "esbuild"

[[edge_functions]]
  function = "track-conversions"
  path = "/thankyou"

[[edge_functions]]
  function = "buy"
  path = "/buy"

[[edge_functions]]
  function = "campaign-links"
  path = "/smosh"

[[edge_functions]]
  function = "campaign-links"
  path = "/smosh/*"

# Must stay above track-utm: it edits the index.html that track-utm serves (and it takes the
# trailing slash off /characters/)
[[edge_functions]]
  function = "character-meta"
  path = "/characters/"

[[edge_functions]]
  function = "character-meta"
  path = "/characters/*"

[[edge_functions]]
  function = "track-utm"
  path = "/*"
  excludedPath=[
    "/.netlify/*",
    "/netlify/",
    "/thankyou",
    "/buy",
    "/smosh",
    "/smosh/*",
    "/sitemap.xml",
    # "/buy_test",
    "/rulebook",
    "/rulebook.pdf",
    "/favicon.ico",
    "/manifest.json",
    "/robots.txt",
    "/*.css",
    "/*.js",
    "/*.map",
    "/*.png",
    "/*.jpg",
    "/*.jpeg",
    "/*.json",
    "/*.webp",
    "/*.svg",
    "/*.gif",
    "/*.ico",
    "/*.woff",
    "/*.woff2",
    "/*.otf",
    "/*.pdf",
    "/*.xml",
  ]

# Browser caching. The build's own files carry a hash in their names, so a browser can keep them for
# good. Images keep their names when they change, so they're fresh for a day, then shown from the cache
# while the browser checks for a new version in the background (a changed one shows on the next visit).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
