<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1"
    />
    <!-- The home page's box, as early as possible (only there: other pages don't show it) -->
    <script>
      if (location.pathname === "/") {
        var heroPreload = document.createElement("link");
        heroPreload.rel = "preload";
        heroPreload.as = "image";
        heroPreload.href = "/images/box/still.webp";
        heroPreload.setAttribute("fetchpriority", "high");
        document.head.appendChild(heroPreload);
        // (and the hero's background texture: otherwise found only once the home page's CSS is in)
        if ("__HOME_BG__".charAt(0) === "/") {
          var bgPreload = document.createElement("link");
          bgPreload.rel = "preload";
          bgPreload.as = "image";
          bgPreload.href = "__HOME_BG__";
          document.head.appendChild(bgPreload);
        }
      }
    </script>

    <!-- Analytics and tracking only on the live site, so test traffic doesn't land in the live reports -->
    <script>
      // (the live site only: not localhost, nor Netlify's deploy previews, whose visits were
      // landing in the live reports)
      window.__ANALYTICS_ENABLED__ =
        location.hostname === "lovecareermagic.com" || location.hostname === "www.lovecareermagic.com";
    </script>

    <!-- MailerLite Universal -->

            }),

        );
        ml("account", "248479");
      }
    </script>
    <!-- End MailerLite Universal -->

    <!-- dataLayer has to exist before GTM loads — trackEvent() pushes GA4
         events into it as GTM custom events. gtag.js is deliberately not
         loaded: GTM is the only tag loader here, and adding gtag.js against
         the same measurement ID would double-count page views. -->
    <script>
      window.dataLayer = window.dataLayer || [];
    </script>

    <!-- Google Tag Manager -->
    <script>
      if (window.__ANALYTICS_ENABLED__) {
        (function (w, d, s, l, i) {
          w[l] = w[l] || [];
          w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
          var f = d.getElementsByTagName(s)[0],
            j = d.createElement(s),
            dl = l != "dataLayer" ? "&l=" + l : "";
          j.async = true;
          j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
          f.parentNode.insertBefore(j, f);
        })(window, document, "script", "dataLayer", "GTM-MPPLX374");
      }
    </script>
    <!-- End Google Tag Manager -->

    <link rel="apple-touch-icon" href="/logo192.png" />

    <style>
      :root {
        --hero-static-banner-height: 38px;
        --hero-static-banner-height-mobile: 45px;
      }

      body {
        overflow-y: scroll;
      }
      html,
      body {
        margin: 0;
      }
      /* Until the app is up: the box, as the home page's hero first shows it (a render of the 3D box,
         in the middle of the hero's stage; BoxHero hides this once its own copy is showing). */
      #hero-static {
        /* out of the page's flow, so the app coming in above it can't push it down, and placed with
           `top`, not a margin, which would carry <body> (and the page's background texture) down */
        position: absolute;
        left: 0;
        right: 0;
        top: var(--hero-static-banner-height);
        height: calc(100svh - var(--hero-static-banner-height));
        overflow: hidden;
      }

      .heroImageStatic {
        position: absolute;
        left: 50%;
        translate: -50% 0;
        aspect-ratio: 4 / 3;
        width: auto;
        top: 5.5rem;
        height: min(
          calc(100svh - var(--hero-static-banner-height) - 7rem),
          106.9vw
        );
      }

      @media only screen and (max-width: 900px) {
        #hero-static {
          top: var(--hero-static-banner-height-mobile);
          height: calc(100svh - var(--hero-static-banner-height-mobile));
        }

        .heroImageStatic {
          /* the stage: the screen less the words above it (about 13rem on a phone) and the buttons
             below it (6.5rem); the picture is centred in it */
          --stage: calc(100svh - var(--hero-static-banner-height-mobile) - 19.7rem);
          top: auto;
          height: min(var(--stage), 106.9vw);
          bottom: calc(6.5rem + (var(--stage) - min(var(--stage), 106.9vw)) / 2);
        }
      }

      .bgTexture {
        height: 100%;
        width: 100%;
        position: absolute;
        /* Pinned so the static hero's top margin (which collapses through
           <body>) can't carry the texture down and back up as it's hidden —
           that jump was the page's largest layout shift. */
        top: 0;
        left: 0;
        z-index: -1;
        opacity: 0.1;
        background-color: rgba(244, 236, 194);
      }

      .bgTexture.with-texture {
        opacity: 0.15;
        background: url("/images/bg_texture.webp");
        background-repeat: repeat;
        background-size: 500px;
      }
    </style>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-MPPLX374"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div class="bgTexture"></div>
    <div class="bgTexture with-texture"></div>

    <div id="modal"></div>
    <div id="sharehome"></div>

    <!-- The home page's box until the app is up (written in only on the home page, so other pages
         neither download it nor flash it) -->
    <div id="hero-static"></div>
    <script>
      (function () {
        var hero = document.getElementById("hero-static");
        if (location.pathname !== "/") return hero.remove();
        var img = document.createElement("img");
        img.src = "/images/box/still.webp";
        img.alt = "The Love, Career & Magic game box.";
        img.className = "heroImageStatic";
        img.width = 1440;
        img.height = 1080;
        img.setAttribute("fetchpriority", "high");
        hero.appendChild(img);
      })();
    </script>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
